<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RAD-O-METER</title>
<style>
  :root{
    --bg:#04120a;
    --green:#2bff5b;
    --green-mid:#17a636;
    --green-dim:#0d5f21;
    --amber:#ffc21a;
    --red:#ff4230;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);color:var(--green);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex;flex-direction:column;overflow:hidden;
    user-select:none;-webkit-user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .crt{
    position:fixed;inset:0;pointer-events:none;z-index:10;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.34) 0px, rgba(0,0,0,.34) 1px, transparent 1px, transparent 3px),
      radial-gradient(120% 90% at 50% 50%, transparent 45%, rgba(0,0,0,.55) 100%);
    animation:flick 5.5s steps(30) infinite;
  }
  @keyframes flick{0%,97%{opacity:1}98%{opacity:.88}99%{opacity:1}}
  .glow{
    position:fixed;inset:0;pointer-events:none;z-index:9;
    background:radial-gradient(70% 45% at 50% 28%, rgba(43,255,91,.055), transparent 70%);
  }

  header{flex:0 0 auto;padding:14px 20px 2px;text-align:center;}
  .brand{font-size:11px;letter-spacing:.5em;color:var(--green-mid);text-transform:uppercase;}
  .cps{
    font-size:clamp(40px,13vw,88px);line-height:1;font-weight:700;margin:8px 0 0;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 4px rgba(43,255,91,.9),0 0 22px rgba(43,255,91,.45);
  }
  .cps.warn{color:var(--amber);text-shadow:0 0 4px rgba(255,194,26,.9),0 0 22px rgba(255,194,26,.45);}
  .cps.danger{color:var(--red);text-shadow:0 0 4px rgba(255,66,48,.9),0 0 26px rgba(255,66,48,.55);}
  .unit{font-size:11px;letter-spacing:.35em;color:var(--green-mid);margin-top:2px;}
  .dose{margin-top:8px;font-size:clamp(12px,3.6vw,16px);color:var(--green-dim);font-variant-numeric:tabular-nums;}
  .dose b{color:var(--green-mid);font-weight:600;}

  /* ---------- sound picker ---------- */
  .picker{
    flex:0 0 auto;padding:14px 12px 0;
  }
  .picker-label{
    text-align:center;font-size:9px;letter-spacing:.3em;
    color:var(--green-dim);margin-bottom:8px;
  }
  .opts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
  .opt{
    flex:1 1 0;min-width:64px;max-width:140px;
    background:#061c0e;border:1px solid var(--green-dim);border-radius:3px;
    color:var(--green-mid);font:inherit;font-size:10px;letter-spacing:.06em;
    padding:9px 3px 8px;cursor:pointer;text-align:center;line-height:1.3;
    overflow-wrap:anywhere;
    transition:background .12s, color .12s, box-shadow .12s;
  }
  .opt span{display:block;font-size:8px;letter-spacing:.16em;color:var(--green-dim);margin-top:3px;}
  .opt.sel{
    background:rgba(43,255,91,.14);border-color:var(--green);color:var(--green);
    box-shadow:0 0 12px rgba(43,255,91,.32), inset 0 0 12px rgba(43,255,91,.1);
  }
  .opt.sel span{color:var(--green-mid);}

  /* ---------- the slider ---------- */
  main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:0 16px;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:100px;
    background:transparent;margin:0;display:block;cursor:pointer;touch-action:none;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:76px;border-radius:4px;border:1px solid var(--green-dim);
    background:
      repeating-linear-gradient(90deg, rgba(43,255,91,.16) 0 1px, transparent 1px 2.5%),
      linear-gradient(90deg, rgba(43,255,91,.16) 0%, rgba(255,194,26,.16) 62%, rgba(255,66,48,.22) 100%),
      #061c0e;
    box-shadow:inset 0 0 14px rgba(0,0,0,.85);
  }
  input[type=range]::-moz-range-track{
    height:76px;border-radius:4px;border:1px solid var(--green-dim);
    background:linear-gradient(90deg,rgba(43,255,91,.16),rgba(255,194,26,.16) 62%,rgba(255,66,48,.22)),#061c0e;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:30px;height:92px;margin-top:-9px;border-radius:3px;
    background:linear-gradient(180deg,#2bff5b,#0f7a26 48%,#062f10 52%,#1fbf44);
    border:1px solid #04120a;box-shadow:0 0 16px rgba(43,255,91,.55),0 2px 8px rgba(0,0,0,.9);
  }
  input[type=range]::-moz-range-thumb{
    width:30px;height:92px;border-radius:3px;border:1px solid #04120a;
    background:linear-gradient(180deg,#2bff5b,#0f7a26 48%,#062f10 52%,#1fbf44);
  }
  .scale{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.2em;
    color:var(--green-dim);padding:10px 2px 0;}
  .hint{text-align:center;font-size:11px;letter-spacing:.28em;color:var(--amber);
    margin-top:16px;min-height:14px;animation:blink 1.1s steps(2,start) infinite;}
  .hint.hidden{visibility:hidden;animation:none;}
  @keyframes blink{50%{opacity:.12}}

  footer{flex:0 0 auto;text-align:center;padding:8px 16px 14px;
    font-size:9px;letter-spacing:.2em;color:#0a4a1a;}
</style>
</head>
<body>

<div class="glow"></div>
<div class="crt"></div>

<header>
  <div class="brand">Rad-O-Meter</div>
  <div class="cps" id="cps">0</div>
  <div class="unit">Counts / second</div>
  <div class="dose"><b id="dose">0.00</b> µSv/h</div>
</header>

<div class="picker">
  <div class="picker-label">▸ PICK A CLICK SOUND — SWITCH ANY TIME</div>
  <div class="opts" id="opts"></div>
</div>

<main>
  <input type="range" id="slider" min="0" max="1000" value="0" step="1" aria-label="Radiation level">
  <div class="scale">
    <span>SAFE</span><span>BACKGROUND</span><span>ELEVATED</span><span>DANGER</span><span>LETHAL</span>
  </div>
  <div class="hint" id="hint">▸ DRAG THE SLIDER</div>
</main>

<footer>PoC · procedural synthesis · Poisson-distributed decay</footer>

<script>
"use strict";

/* ============================================================
   CLICK CHARACTERS

   All five share the same model: an impulse excites three
   resonators that ring down. What separates them is how the
   instrument is built — how big the box is, whether the speaker
   sits in a bakelite case or an earpiece, how hard it is driven.

   body = the fundamental tone, bite = the metallic midrange,
   snap = the transient on top.
   ============================================================ */

const PRESETS = [
  {
    id:'dry', name:'DRY', desc:'tin can',
    body:[1000, 9,0.75], bite:[2700,14,1.00], snap:[5900, 4,0.40],
    decay:0.0022, noiseMs:0.4, noiseAmt:0.8, sat:2.2, lenMs:18, trim:1.00
  },
  {
    id:'dp5', name:'DOSIMETER', desc:'soviet',
    body:[ 780,12,1.00], bite:[1900,18,0.90], snap:[3600, 7,0.35],
    decay:0.0060, noiseMs:0.8, noiseAmt:0.7, sat:3.0, lenMs:30, trim:0.92
  },
  {
    id:'ear', name:'EARPIECE', desc:'headphone',
    body:[2200, 6,0.30], bite:[4200, 9,1.00], snap:[7800, 5,0.60],
    decay:0.0012, noiseMs:0.25,noiseAmt:1.0, sat:1.5, lenMs:10, trim:1.05
  },
  {
    id:'piezo', name:'PIEZO', desc:'digital',
    body:[3000,30,0.60], bite:[4100,40,1.00], snap:[8200, 6,0.25],
    decay:0.0080, noiseMs:0.2, noiseAmt:0.4, sat:1.2, lenMs:25, trim:0.88
  },
  {
    id:'rattle', name:'RATTLE', desc:'coarse',
    body:[ 600, 7,1.00], bite:[1500, 9,0.80], snap:[3000, 5,0.60],
    decay:0.0040, noiseMs:2.5, noiseAmt:1.0, sat:4.0, lenMs:22, trim:0.95
  }
];

let preset = PRESETS[1];          // start on the dosimeter

/* ============================================================
   1. SYNTHESIS
   ============================================================ */

let ctx = null, master = null, hissGain = null;
let clickBuffers = [];

function bandpass(input, f0, Q, fs){
  const w0 = 2*Math.PI*f0/fs, alpha = Math.sin(w0)/(2*Q);
  const b0 = alpha, b2 = -alpha;
  const a0 = 1+alpha, a1 = -2*Math.cos(w0), a2 = 1-alpha;
  const out = new Float32Array(input.length);
  let x1=0,x2=0,y1=0,y2=0;
  for(let n=0;n<input.length;n++){
    const x0 = input[n];
    const y0 = (b0*x0 + b2*x2 - a1*y1 - a2*y2)/a0;
    x2=x1; x1=x0; y2=y1; y1=y0; out[n]=y0;
  }
  return out;
}

function renderClick(p, fs, i){
  const len = Math.floor(fs*p.lenMs/1000);
  const exc = new Float32Array(len);
  exc[0] = 1;                                        // the voltage spike
  const nl = Math.max(1, Math.floor(fs*p.noiseMs/1000));
  for(let n=0;n<nl;n++) exc[n] += (Math.random()*2-1)*(1-n/nl)*p.noiseAmt;

  const j = i/12;                                    // variation click to click
  const w = (spec, spread) => bandpass(exc, spec[0]*(1 + j*0.10) + Math.random()*spread, spec[1], fs);
  const body = w(p.body, 120), bite = w(p.bite, 260), snap = w(p.snap, 500);

  const out = new Float32Array(len);
  let peak = 1e-9;
  for(let n=0;n<len;n++){
    const t = n/fs;
    const env = Math.exp(-t/p.decay);
    let v = (body[n]*p.body[2] + bite[n]*p.bite[2] + snap[n]*p.snap[2]) * env;
    v = Math.tanh(v*p.sat)/p.sat;                    // speaker saturation
    out[n] = v;
    const a = Math.abs(v); if(a>peak) peak = a;
  }
  const fade = Math.floor(fs*0.0015);
  for(let n=0;n<len;n++){
    let g = p.trim/peak;
    if(n > len-fade) g *= (len-n)/fade;              // land on zero
    out[n] *= g;
  }
  const ab = ctx.createBuffer(1, len, fs);
  ab.copyToChannel(out, 0);
  return ab;
}

function buildBuffers(){
  clickBuffers = [];
  for(let i=0;i<12;i++) clickBuffers.push(renderClick(preset, ctx.sampleRate, i));
}

function saturationCurve(amount){
  const n = 1024, c = new Float32Array(n);
  for(let i=0;i<n;i++){ const x = i*2/n - 1; c[i] = Math.tanh(x*amount)/Math.tanh(amount); }
  return c;
}

function initAudio(){
  if(ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const fs = ctx.sampleRate;

  const shaper = ctx.createWaveShaper();
  shaper.curve = saturationCurve(1.7); shaper.oversample = '2x';
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value=-14; comp.knee.value=8; comp.ratio.value=14;
  comp.attack.value=0.001; comp.release.value=0.09;

  master = ctx.createGain(); master.gain.value = 0.95;
  master.connect(shaper).connect(comp).connect(ctx.destination);

  buildBuffers();

  // Hiss bed: at high rates the clicks merge into a roar
  const nb = ctx.createBuffer(1, fs*2, fs);
  const nd = nb.getChannelData(0);
  let lp = 0;
  for(let n=0;n<nd.length;n++){ const w=Math.random()*2-1; lp += (w-lp)*0.35; nd[n]=lp*0.9; }
  const hiss = ctx.createBufferSource(); hiss.buffer = nb; hiss.loop = true;
  const hbp = ctx.createBiquadFilter();
  hbp.type='bandpass'; hbp.frequency.value=2000; hbp.Q.value=0.7;
  hissGain = ctx.createGain(); hissGain.gain.value = 0;
  hiss.connect(hbp).connect(hissGain).connect(master);
  hiss.start();

  scheduledUntil = ctx.currentTime;
  setInterval(scheduler, SCHED_MS);
  requestAnimationFrame(uiLoop);
}

/* ============================================================
   2. THE DECAY  (Poisson process)
   ============================================================ */

const SCHED_MS = 25, LOOKAHEAD = 0.10, MAX_WINDOW = 0.30, MAX_PER_TICK = 300;
let rate = 0, scheduledUntil = 0, pulseCounter = 0;

function poisson(lam){
  if(lam <= 0) return 0;
  if(lam < 30){                                     // Knuth's method
    const L = Math.exp(-lam); let k=0, p=1;
    do { k++; p *= Math.random(); } while(p > L);
    return k-1;
  }
  const u1=Math.random(), u2=Math.random();          // normal approximation
  const z = Math.sqrt(-2*Math.log(1-u1))*Math.cos(2*Math.PI*u2);
  return Math.max(0, Math.round(lam + Math.sqrt(lam)*z));
}

function scheduleClick(time, gainScale){
  const src = ctx.createBufferSource();
  src.buffer = clickBuffers[(Math.random()*clickBuffers.length)|0];
  src.playbackRate.value = 0.92 + Math.random()*0.16;
  const g = ctx.createGain();
  g.gain.value = (0.6 + Math.random()*0.4) * gainScale;
  src.connect(g).connect(master);
  src.start(time);
  src.onended = () => g.disconnect();
  pulseCounter++;
}

function scheduler(){
  if(!ctx) return;
  const now = ctx.currentTime;
  if(scheduledUntil < now) scheduledUntil = now;
  const target = now + LOOKAHEAD;
  let dt = target - scheduledUntil;
  if(dt <= 0) return;
  if(dt > MAX_WINDOW) dt = MAX_WINDOW;

  if(rate > 0){
    let n = poisson(rate*dt);
    if(n > MAX_PER_TICK) n = MAX_PER_TICK;
    // Denser clicks -> lower level each, or the sum runs away
    const gs = 1/Math.sqrt(Math.max(1, rate/60));
    for(let k=0;k<n;k++) scheduleClick(scheduledUntil + Math.random()*dt, gs);
  }
  scheduledUntil += dt;
}

/* ============================================================
   3. SLIDER -> RATE
   ============================================================ */

const MIN_RATE = 0.4, MAX_RATE = 1400;
const sliderToRate = v => v <= 0.001 ? 0 : MIN_RATE*Math.pow(MAX_RATE/MIN_RATE, v);

const slider = document.getElementById('slider');
const hint   = document.getElementById('hint');
const cpsEl  = document.getElementById('cps');
const doseEl = document.getElementById('dose');
const optsEl = document.getElementById('opts');

function selectPreset(i){
  preset = PRESETS[i];
  [...optsEl.children].forEach((c,k) => c.classList.toggle('sel', k === i));
  if(ctx){
    if(ctx.state === 'suspended') ctx.resume();
    buildBuffers();                                  // swaps the sound at once
  }
}

PRESETS.forEach((p, i) => {
  const b = document.createElement('button');
  b.innerHTML = (i+1) + '. ' + p.name + '<span>' + p.desc + '</span>';
  b.addEventListener('click', () => { initAudio(); selectPreset(i); });
  optsEl.appendChild(b);
});
selectPreset(1);                                      // start on the dosimeter

function onInput(){
  initAudio();
  if(ctx.state === 'suspended') ctx.resume();
  hint.classList.add('hidden');
  rate = sliderToRate(slider.value/1000);
  if(hissGain){
    const h = rate < 150 ? 0 : Math.min(0.06, (rate-150)/1250*0.06);
    hissGain.gain.setTargetAtTime(h, ctx.currentTime, 0.08);
  }
  render();
}
slider.addEventListener('input', onInput);
slider.addEventListener('pointerdown', onInput);
slider.addEventListener('touchstart', onInput, {passive:true});

/* Keys 1-5 switch sound, for quick A/B */
window.addEventListener('keydown', e => {
  if(e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = '12345'.indexOf(e.key);
  if(i >= 0){ initAudio(); selectPreset(i); }
});

/* ============================================================
   4. READOUT
   ============================================================ */

function render(){
  cpsEl.textContent = rate < 10 ? rate.toFixed(1) : Math.round(rate);
  doseEl.textContent = (rate*60/151).toFixed(2);      // SBM-20: ~151 CPM per µSv/h
  cpsEl.className = 'cps' + (rate > 300 ? ' danger' : rate > 40 ? ' warn' : '');
}

let lastCount = 0, flashUntil = 0, glowOn = null;
const glowEl = document.querySelector('.glow');
function uiLoop(t){
  requestAnimationFrame(uiLoop);
  if(pulseCounter !== lastCount){ lastCount = pulseCounter; flashUntil = t + 40; }
  const on = t < flashUntil;
  if(on !== glowOn){ glowOn = on; glowEl.style.opacity = on ? '2.2' : '1'; }
}

render();
</script>
</body>
</html>
